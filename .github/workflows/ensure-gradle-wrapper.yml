name: Ensure Gradle wrapper jar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ensure-gradle-wrapper.yml'
      - 'mobile/android/gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: write

jobs:
  wrapper-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Gradle 8.7 wrapper (jar + scripts)
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fsSL -o mobile/android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o mobile/android/gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          curl -fsSL -o mobile/android/gradlew.bat \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew.bat"
          chmod +x mobile/android/gradlew
          ls -la mobile/android/gradlew mobile/android/gradlew.bat mobile/android/gradle/wrapper/
          python3 -c "d=open('mobile/android/gradle/wrapper/gradle-wrapper.jar','rb').read(4); assert d[:2]==b'PK', d"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android/gradle/wrapper/gradle-wrapper.jar mobile/android/gradlew mobile/android/gradlew.bat
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "build(android): Gradle 8.7 wrapper scripts (gradlew / gradlew.bat)"
          git push
