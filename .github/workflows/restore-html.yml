name: Restore HTML

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-html.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch last good HTML and add exclamation
        run: |
          set -euo pipefail
          # Last known good page (before accidental overwrite)
          curl -fsSL \
            "https://raw.githubusercontent.com/notcristi14/GTA-VI-Countdown/f266ac3/gta-vi-countdown.html" \
            -o gta-vi-countdown.html

          # Add exclamation mark after Available now
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gta-vi-countdown.html')
          t = p.read_text(encoding='utf-8')
          old = "document.getElementById('cd').innerHTML = '<p class=\"done\">Available now</p>';"
          new = "document.getElementById('cd').innerHTML = '<p class=\"done\">Available now!</p>';"
          if old not in t and "Available now!</p>" not in t:
              raise SystemExit('Available now string not found')
          if old in t:
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          print('OK', len(t), 'Available now!' in t)
          PY

          grep -q 'Available now!' gta-vi-countdown.html
          grep -q '<!DOCTYPE html>' gta-vi-countdown.html
          wc -c gta-vi-countdown.html

      - name: Commit and push restored HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gta-vi-countdown.html
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "fix(ui): restore gta-vi-countdown.html; Available now!"
            git push
          fi
