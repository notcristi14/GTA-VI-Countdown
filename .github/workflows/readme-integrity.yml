name: README integrity check

# Layout policy
# -------------
# README design/layout is owned by the hand-written templates in:
#   README.md
#   mobile/README.md
#   launcher/README.md
#   launcher/assets/README.md
#
# Structure (mirrored across those files):
#   1. Title + short pitch
#   2. Key facts / links (tables where useful)
#   3. Feature or build sections with emoji headings where the root doc uses them
#   4. Requirements / Build
#   5. Legal (where applicable)
#   6. AUTO-GENERATED integrity block at the end only
#
# scripts/readme-integrity-check.js must NOT rewrite the hand-written layout.
# It only upserts content between:
#   <!-- AUTO-GENERATED: readme-integrity-check -->
#   <!-- END AUTO-GENERATED -->
# and the mobile facts markers on mobile/README.md.

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gta-vi-countdown.html'
      - 'app.js'
      - 'music.js'
      - 'music.css'
      - 'music-discovery.js'
      - 'backgrounds-api.js'
      - 'github-api.js'
      - 'bgs/**'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'mobile/README.md'
      - 'launcher/src/**'
      - 'launcher/*.sln'
      - 'launcher/*.vcxproj'
      - 'launcher/assets/**'
      - 'launcher/README.md'
      - 'launcher/assets/README.md'
      - 'scripts/readme-integrity-check.js'
      - 'package.json'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: readme-integrity
  cancel-in-progress: true

jobs:
  integrity:
    # Avoid re-entry when this workflow commits README integrity sections.
    # schedule / workflow_dispatch still run; human pushes still run.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan source and update integrity sections only
        id: check
        run: |
          set -uo pipefail
          set +e
          node scripts/readme-integrity-check.js | tee /tmp/integrity-out.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -q 'README_CHANGED=1' /tmp/integrity-out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^FAIL ' /tmp/integrity-out.txt; then
            echo "::warning::Integrity checks reported FAIL lines — see scripts/integrity-report.json"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -40 /tmp/integrity-out.txt
          echo "$code" > /tmp/integrity-exit-code

      - uses: actions/upload-artifact@v4
        with:
          name: integrity-report
          path: scripts/integrity-report.json
          if-no-files-found: warn

      - name: Commit integrity sections when they changed
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mobile/README.md launcher/README.md launcher/assets/README.md scripts/integrity-report.json
          git add '**/README.md' 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing staged"
            exit 0
          fi
          git commit -m "chore(docs): sync README integrity sections [skip ci]"
          git push

      - name: Fail job on critical integrity failures
        run: |
          code=$(cat /tmp/integrity-exit-code 2>/dev/null || echo 0)
          if [ "$code" != "0" ]; then
            echo "Integrity script exited with code $code (critical failures)."
            exit "$code"
          fi
          echo "Integrity script exited 0."
