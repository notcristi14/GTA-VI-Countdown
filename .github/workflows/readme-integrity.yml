name: README integrity check

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gta-vi-countdown.html'
      - 'app.js'
      - 'music.js'
      - 'music.css'
      - 'music-discovery.js'
      - 'backgrounds-api.js'
      - 'github-api.js'
      - 'bgs/**'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'launcher/src/**'
      - 'launcher/*.sln'
      - 'launcher/*.vcxproj'
      - 'launcher/assets/**'
      - 'scripts/readme-integrity-check.js'
      - 'scripts/ric.b64.*'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: readme-integrity
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode integrity script from base64 parts
        run: |
          set -euo pipefail
          if ls scripts/ric.b64.* >/dev/null 2>&1; then
            cat scripts/ric.b64.0 scripts/ric.b64.1 scripts/ric.b64.2 scripts/ric.b64.3 2>/dev/null | base64 -d > scripts/readme-integrity-check.js
            echo "Decoded $(wc -c < scripts/readme-integrity-check.js) bytes"
          fi
          test -s scripts/readme-integrity-check.js
          node --check scripts/readme-integrity-check.js

      - name: Scan implementation and regenerate all READMEs
        id: check
        run: |
          set -euo pipefail
          node scripts/readme-integrity-check.js | tee /tmp/integrity-out.txt
          if grep -q 'README_CHANGED=1' /tmp/integrity-out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^FAIL ' /tmp/integrity-out.txt; then
            echo "::warning::Integrity checks reported FAIL lines"
          fi
          tail -30 /tmp/integrity-out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: integrity-report
          path: scripts/integrity-report.json
          if-no-files-found: warn

      - name: Commit documentation when it changed
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mobile/README.md launcher/README.md launcher/assets/README.md scripts/integrity-report.json
          if git diff --staged --quiet; then
            echo "Nothing staged"
            exit 0
          fi
          git commit -m "chore(docs): sync READMEs with implementation [skip ci]"
          git push
