name: README integrity check

# Layout policy
# -------------
# README design/layout is owned by the hand-written templates in:
#   README.md
#   mobile/README.md
#   launcher/README.md
#   launcher/assets/README.md
#
# The root README Structure code block is generated from the complete recursive
# repository inventory by scripts/project-structure-audit.js. Do not hand-edit
# that ASCII tree; new files/directories are inserted automatically on each audit.
# Structure (mirrored across those files):
#   1. Title + short pitch
#   2. Key facts / links (tables where useful)
#   3. Feature or build sections with emoji headings where the root doc uses them
#   4. Requirements / Build
#   5. Legal (where applicable)
#   6. AUTO-GENERATED integrity block at the end only
#
# scripts/readme-integrity-check.js preserves hand-written layout and prose.
# It regenerates only the root README Structure code block, then upserts content between:
#   <!-- AUTO-GENERATED: readme-integrity-check -->
#   <!-- END AUTO-GENERATED -->
# and the mobile facts markers on mobile/README.md.
#
# Push path policy
# ----------------
# Include every path on main by default (`**`), then exclude noise with `!`
# patterns (GitHub Actions does not combine paths + paths-ignore here).
# Positive patterns first; negative patterns after. New files and directories
# of any extension are covered automatically.
# Job-level actor guard still skips github-actions[bot] pushes to prevent loops.

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Include entire tree first
      - '**'
      # Explicit exclusions (negative patterns only after positives)
      - '!node_modules/**'
      - '!**/node_modules/**'
      - '!build/**'
      - '!**/build/**'
      - '!coverage/**'
      - '!**/coverage/**'
      - '!DerivedData/**'
      - '!**/DerivedData/**'
      - '!.gradle/**'
      - '!**/.gradle/**'
      - '!.git/**'
      - '!**/.git/**'
      - '!.idea/**'
      - '!**/.idea/**'
      - '!.vscode/**'
      - '!**/.vscode/**'
      - '!**/local.properties'
      - '!**/*.log'
      - '!**/.DS_Store'
      - '!**/Thumbs.db'
      - '!**/*.tmp'
      - '!**/*.temp'

permissions:
  contents: write

concurrency:
  group: readme-integrity
  cancel-in-progress: true

jobs:
  integrity:
    # Avoid re-entry when this workflow commits README integrity sections.
    # schedule / workflow_dispatch still run; human pushes still run.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run documentation, dynamic Git, and release audit tests
        id: tests
        run: |
          node scripts/test-doc-audit.js
          node test/dynamic-doc-audit.test.js
          node test/release-audit.test.js
          node test/project-structure-audit.test.js

      - name: Scan source and update integrity sections only
        id: check
        env:
          DYNAMIC_AUDIT_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          DYNAMIC_AUDIT_HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          node scripts/readme-integrity-check.js | tee /tmp/integrity-out.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -q 'README_CHANGED=1' /tmp/integrity-out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^FAIL ' /tmp/integrity-out.txt; then
            echo "::warning::Integrity checks reported FAIL lines — see scripts/integrity-report.json"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -40 /tmp/integrity-out.txt
          echo "$code" > /tmp/integrity-exit-code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-report
          path: scripts/integrity-report.json
          if-no-files-found: warn

      - name: Commit integrity sections when they changed
        if: steps.tests.outcome == 'success' && steps.check.outputs.changed == 'true' && steps.check.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every README.md discovered in the tree (dynamic; exclusions match findReadmes)
          git add scripts/integrity-report.json
          while IFS= read -r -d '' f; do git add -- "$f"; done < <(find . -type f -name 'README.md' \
            -not -path './.git/*' \
            -not -path './node_modules/*' -not -path '*/node_modules/*' \
            -not -path './build/*' -not -path '*/build/*' \
            -not -path '*/DerivedData/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/coverage/*' \
            -not -path '*/.idea/*' \
            -not -path '*/.vscode/*' \
            -print0 2>/dev/null)
          if git diff --staged --quiet; then
            echo "Nothing staged"
            exit 0
          fi
          git commit -m "chore(docs): sync README integrity sections [skip ci]"
          git push

      - name: Fail job on critical integrity failures
        if: always()
        run: |
          code=$(cat /tmp/integrity-exit-code 2>/dev/null || echo 0)
          if [ "$code" != "0" ]; then
            echo "Integrity script exited with code $code (critical failures)."
            exit "$code"
          fi
          echo "Integrity script exited 0."
