name: iOS Cloud Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Build iOS App
      working-directory: mobile/ios
      run: |
        xcodebuild \
          -project VICountdown.xcodeproj \
          -scheme VICountdown \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath build

    - name: Create App Payload Archive
      working-directory: mobile/ios
      run: |
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/VICountdown.app Payload/
        zip -r ../../gta-countdown.ipa Payload

    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-binary
        path: gta-countdown.ipa