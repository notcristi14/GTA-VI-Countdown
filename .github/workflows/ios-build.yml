name: iOS Cloud Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Project Dependencies
      working-directory: mobile/ios
      run: |
        npm install

    - name: Clean and Export Static Production Bundle
      working-directory: mobile/ios
      run: |
        npx expo export --platform ios

    - name: Create App Payload Archive
      working-directory: mobile/ios
      run: |
        mkdir -p Payload
        cp -R dist/ Payload/gta-countdown.app
        zip -r ../../gta-countdown.ipa Payload

    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-binary
        path: gta-countdown.ipa
