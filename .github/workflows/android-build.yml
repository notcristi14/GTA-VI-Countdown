name: Android Cloud Build

on:
  push:
    branches: [ main ]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        working-directory: mobile/android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Configure runner Android SDK path
        working-directory: mobile/android
        run: printf 'sdk.dir=%s\\n' "$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK and package identity
        working-directory: mobile/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.notcristi.vicountdown'"
          sha256sum "$APK" > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: VI-Countdown-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
