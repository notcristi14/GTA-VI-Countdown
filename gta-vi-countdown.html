<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a0a2e url('bg.jpeg') center/cover no-repeat fixed;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(26,10,46,0.55) 0%, rgba(15,12,41,0.75) 50%, rgba(10,10,10,0.85) 100%);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    max-width: min(420px, 85vw);
    width: 100%;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
    /* Removes the solid black background dynamically */
    mix-blend-mode: screen; 
  }
  .sub {
    font-size: 0.85rem;
    color: #e0b0ff;
    margin-bottom: 36px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .countdown {
    display: flex;
    gap: clamp(12px, 4vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    min-width: 80px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 14px;
    padding: 18px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .num {
    font-size: clamp(2rem, 8vw, 3.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 18px rgba(255,105,180,0.6);
  }
  .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #d8b4fe;
    margin-top: 10px;
  }
  .done {
    font-size: 1.5rem;
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74,222,128,0.5);
  }
  @media (max-width: 480px) {
    .unit { min-width: 70px; padding: 14px 10px; }
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo"><img src="logo.heic" alt="Grand Theft Auto VI"></div>
    <p class="sub">PlayStation Store · November 19, 2026</p>
    <div class="countdown" id="cd">
      <div class="unit"><div class="num" id="d">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="label">Mins</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="label">Secs</div></div>
    </div>
  </div>
<script>
  const target = new Date('2026-11-19T05:00:00Z').getTime();
  function tick() {
    const now = Date.now();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById('cd').innerHTML = '<p class="done">Available now</p>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
