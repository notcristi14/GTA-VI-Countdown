<script>
  const regions = {
    'new-zealand': { name: 'New Zealand', target: '2026-11-18T11:00:00Z' },
    'australia': { name: 'Australia', target: '2026-11-18T13:00:00Z' },
    'japan-korea': { name: 'Japan & South Korea', target: '2026-11-18T15:00:00Z' },
    'asia-pacific': { name: 'Hong Kong, Taiwan, Singapore, Malaysia', target: '2026-11-18T16:00:00Z' },
    'indonesia-thailand': { name: 'Indonesia & Thailand', target: '2026-11-18T17:00:00Z' },
    'india': { name: 'India', target: '2026-11-18T18:30:00Z' },
    'uae': { name: 'United Arab Emirates', target: '2026-11-18T20:00:00Z' },
    'saudi-turkey': { name: 'Saudi Arabia & Turkey', target: '2026-11-18T21:00:00Z' },
    'eastern-europe': { name: 'Eastern Europe / UTC+2 (Greece, Romania, Finland, Israel, South Africa, etc.)', target: '2026-11-18T22:00:00Z' },
    'europe': { name: 'Central Europe (CET)', target: '2026-11-18T23:00:00Z' },
    'uk': { name: 'United Kingdom, Ireland, Iceland, Portugal', target: '2026-11-19T00:00:00Z' },
    'south-america': { name: 'Brazil, Argentina, Chile, Paraguay, Uruguay', target: '2026-11-19T03:00:00Z' },
    'bolivia': { name: 'Bolivia', target: '2026-11-19T04:00:00Z' },
    'us-canada': { name: 'United States, Canada + Colombia, Ecuador, Panama, Peru', target: '2026-11-19T05:00:00Z' },
    'mexico': { name: 'Mexico & Central America', target: '2026-11-19T06:00:00Z' }
  };

  const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  const savedRegion = localStorage.getItem('gtaRegion');
  let activeSlug = 'europe';
  if (pathSlug && regions[pathSlug]) {
    activeSlug = pathSlug;
    localStorage.setItem('gtaRegion', pathSlug);
  } else if (savedRegion && regions[savedRegion]) {
    activeSlug = savedRegion;
    // Redirect to saved region path so URL stays consistent
    if (pathSlug !== activeSlug) {
      history.replaceState(null, '', '/' + activeSlug);
    }
  }
  const currentRegion = regions[activeSlug];

  const selectEl = document.getElementById('regionSelect');
  Object.keys(regions).forEach(slug => {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = regions[slug].name;
    if (slug === activeSlug) opt.selected = true;
    selectEl.appendChild(opt);
  });

  selectEl.addEventListener('change', () => {
    const val = selectEl.value;
    localStorage.setItem('gtaRegion', val);
    location.href = '/' + val;
  });

  document.title = `GTA VI Countdown - ${currentRegion.name}`;
  document.getElementById('subText').textContent = `Releasing Nov 19, 2026 · ${currentRegion.name}`;

  const targetTime = new Date(currentRegion.target).getTime();
  function tick() {
    const now = Date.now();
    const diff = targetTime - now;
    if (diff <= 0) {
      document.getElementById('cd').innerHTML = '<p class="done">Available now</p>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);

  

  const backgrounds = ['main.jpeg', 'Ambrosia_Postcard_landscape.jpg', 'Boobie_Ike_landscape.jpg', 'Brian_Heder_landscape.jpg', 'Cal_Hampton_landscape.jpg', 'DreQuan_Priest_landscape.jpg', 'Grassrivers_Postcard_landscape.jpg', 'Jason_and_Lucia_01_With_Logos_landscape.jpg', 'Jason_and_Lucia_01_landscape.jpg', 'Jason_and_Lucia_02_With_Logos_landscape.jpg', 'Jason_and_Lucia_02_landscape.jpg', 'Jason_and_Lucia_Beach_With_Logos_landscape.jpg', 'Jason_and_Lucia_Beach_landscape.jpg', 'Jason_and_Lucia_Motel_landscape.jpg', 'Jason_and_Lucia_Robbery_With_Logo_landscape.jpg', 'Jason_and_Lucia_Robbery_landscape.jpg', 'Leonida_Keys_Postcard_landscape.jpg', 'Mount_Kalaga_National_Park_Postcard_landscape.jpg', 'Official_Cover_Art_landscape.jpg', 'Port_Gellhorn_Postcard_landscape.jpg', 'Raul_Bautista_landscape.jpg', 'Real_Dimez_landscape.jpg', 'The_Album_Cover_Art_landscape.jpg', 'Vice_City_Postcard_landscape.jpg'];
  let bgIndex = 0;
  let usingA = true;
  const bgA = document.getElementById('bgA');
  const bgB = document.getElementById('bgB');
  const bgBtn = document.getElementById('bgCycleBtn');
  const bgResetBtn = document.getElementById('bgResetBtn');

  function setBg(i, animate) {
    bgIndex = ((i % backgrounds.length) + backgrounds.length) % backgrounds.length;
    const url = '/bgs/' + backgrounds[bgIndex];
    localStorage.setItem('gtaBgIndex', bgIndex);
    const incoming = usingA ? bgB : bgA;
    const outgoing = usingA ? bgA : bgB;
    const apply = () => {
      incoming.style.backgroundImage = "url('" + url + "')";
      if (animate === false) {
        incoming.classList.add('show');
        outgoing.classList.remove('show');
        usingA = !usingA;
        return;
      }
      incoming.classList.add('show');
      outgoing.classList.remove('show');
      usingA = !usingA;
    };
    const img = new Image();
    img.onload = apply;
    img.onerror = apply;
    img.src = url;
  }
  if (bgBtn) bgBtn.addEventListener('click', () => setBg(bgIndex + 1, true));
  if (bgResetBtn) bgResetBtn.addEventListener('click', () => setBg(0, true));
  const savedIdx = localStorage.getItem('gtaBgIndex');
  if (savedIdx !== null) setBg(parseInt(savedIdx, 10), false);



  const fallbackNews = [
    { title: 'Pre-Order The Goodtime State – Vice City Collection Now While Supplies Last', date: 'Sep 24, 2026', category: 'Grand Theft Auto VI', url: 'https://www.rockstargames.com/newswire' },
    { title: 'Announcing Grand Theft Auto VI: The Album, Coming November 19', date: 'Sep 17, 2026', category: 'Grand Theft Auto VI', url: 'https://www.rockstargames.com/newswire' },
    { title: 'GTA+ Members Enjoy One Week of Early Access to the New Pegassi Horus Supercar', date: 'Sep 10, 2026', category: 'GTA Online', url: 'https://www.rockstargames.com/newswire' },
    { title: 'Compete Across Entrepreneurial Endeavors in the GTA Online Business Rivalries Event', date: 'Sep 3, 2026', category: 'GTA Online', url: 'https://www.rockstargames.com/newswire' },
    { title: 'Grand Theft Auto VI: An Extended Look — Now Playing', date: 'Aug 27, 2026', category: 'Grand Theft Auto VI', url: 'https://www.rockstargames.com/newswire/article/4k138k8okkk483/grand-theft-auto-vi-an-extended-look-now-playing' },
    { title: 'Pre-Order Grand Theft Auto VI on June 25', date: 'Jun 24, 2026', category: 'Grand Theft Auto VI', url: 'https://www.rockstargames.com/newswire/article/5171972o3ak5oa/pre-order-grand-theft-auto-vi-on-june-25' }
  ];

  function renderNews(items) {
    const list = document.getElementById('newsList');
    if (!list) return;
    if (!items || !items.length) {
      list.innerHTML = '<div class="news-empty">Could not load news. <a href="https://www.rockstargames.com/newswire" target="_blank" rel="noopener">Open Newswire</a></div>';
      return;
    }
    list.innerHTML = items.slice(0, 8).map(item => {
      const meta = [item.category, item.date].filter(Boolean).join(' · ');
      const url = item.url || 'https://www.rockstargames.com/newswire';
      return '<a class="news-item" href="' + url + '" target="_blank" rel="noopener"><div class="news-meta">' + meta + '</div><div class="news-title">' + item.title + '</div></a>';
    }).join('');
  }

  async function loadNews() {
    try {
      const res = await fetch('/api/news', { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      if (data && data.items && data.items.length) {
        renderNews(data.items);
        return;
      }
    } catch (e) {}
    renderNews(fallbackNews);
  }

  const newsSection = document.getElementById('news');
  const newsToggleBtn = document.getElementById('newsToggleBtn');
  function setNewsVisible(visible) {
    if (!newsSection) return;
    newsSection.classList.toggle('hidden', !visible);
    localStorage.setItem('gtaNews', visible ? 'on' : 'off');
    if (newsToggleBtn) newsToggleBtn.textContent = visible ? 'Hide News' : 'Show News';
  }
  const savedNews = localStorage.getItem('gtaNews');
  setNewsVisible(savedNews !== 'off');
  if (newsToggleBtn) newsToggleBtn.addEventListener('click', () => {
    setNewsVisible(newsSection && newsSection.classList.contains('hidden'));
  });

  loadNews();

</script>
</body>
</html>
