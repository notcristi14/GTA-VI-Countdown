<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>

<!-- Standard Desktop & Browser Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="/logo.png">
<link rel="shortcut icon" type="image/png" href="/logo.png">

<!-- Android Chrome & Chrome Mobile History / Tab Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="/logo.png">
<link rel="icon" type="image/png" sizes="512x512" href="/logo.png">

<!-- iOS Safari & iOS Chrome Touch Icons -->
<link rel="apple-touch-icon" sizes="180x180" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">

<!-- Inline Web App Manifest for Google Chrome Mobile -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GTA%20VI%20Countdown%22%2C%22short_name%22%3A%22GTA%20VI%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22%2Flogo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22%2Flogo.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%231a0a2e%22%2C%22background_color%22%3A%22%231a0a2e%22%7D">

<!-- Mobile Web App & Theme Color Meta Tags -->
<meta name="theme-color" content="#1a0a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA VI Countdown">

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a0a2e url('/bg.jpeg') center/cover no-repeat fixed;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 20px 16px;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg, 
      rgba(15, 8, 30, 0.55) 0%, 
      rgba(10, 10, 20, 0.70) 100%
    );
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
  }

  .logo {
    max-width: min(420px, 85vw);
    width: 100%;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.6));
  }

  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  .sub {
    font-size: clamp(0.75rem, 2.5vw, 0.85rem);
    color: #e0b0ff;
    margin-bottom: 16px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    padding: 0 10px;
  }

  .region-selector {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }

  .region-selector label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #d8b4fe;
  }

  .region-selector select {
    background: rgba(20, 10, 40, 0.85);
    color: #fff;
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.85rem;
    backdrop-filter: blur(12px);
    cursor: pointer;
    outline: none;
    max-width: 100%;
  }

  .region-selector select option {
    background: #1a0a2e;
    color: #fff;
  }

  .platforms {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    width: 100%;
  }

  .platform-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    padding: 8px 16px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #fff;
  }

  .platform-icon {
    height: 16px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .countdown {
    display: flex;
    gap: clamp(8px, 2.5vw, 24px);
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .unit {
    flex: 1;
    min-width: 72px;
    max-width: 120px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 14px;
    padding: 16px 10px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .num {
    font-size: clamp(1.8rem, 7vw, 3.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 105, 180, 0.6);
  }

  .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #d8b4fe;
    margin-top: 8px;
  }

  .done {
    font-size: 1.5rem;
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 12px;
    }
    .sub {
      margin-bottom: 12px;
    }
    .region-selector {
      margin-bottom: 20px;
    }
    .platforms {
      gap: 8px;
      margin-bottom: 24px;
    }
    .platform-badge {
      padding: 6px 12px;
      font-size: 0.75rem;
    }
    .unit {
      min-width: 64px;
      padding: 12px 6px;
    }
    .label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
    }
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo">
      <img src="/logo.png" alt="Grand Theft Auto VI Logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg'">
    </div>

    <p class="sub" id="subText">Releasing November 19, 2026</p>
    
    <div class="region-selector">
      <label for="regionSelect">Region:</label>
      <select id="regionSelect" onchange="location.href='/' + this.value"></select>
    </div>

    <div class="platforms">
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg" alt="PlayStation Logo">
        <span>PlayStation 5</span>
      </div>
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" alt="Xbox Logo">
        <span>Xbox Series X|S</span>
      </div>
    </div>

    <div class="countdown" id="cd">
      <div class="unit"><div class="num" id="d">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="label">Mins</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="label">Secs</div></div>
    </div>
  </div>

<script>
  const regions = {
    'europe': { name: 'Europe (CET / Central)', target: '2026-11-18T23:00:00Z' },
    'uk': { name: 'United Kingdom & Ireland', target: '2026-11-19T00:00:00Z' },
    'us-canada': { name: 'United States & Canada', target: '2026-11-19T05:00:00Z' },
    'new-zealand': { name: 'New Zealand', target: '2026-11-18T11:00:00Z' },
    'australia': { name: 'Australia', target: '2026-11-18T13:00:00Z' },
    'japan-korea': { name: 'Japan & South Korea', target: '2026-11-18T15:00:00Z' },
    'asia-pacific': { name: 'Hong Kong, Taiwan, SG, MY', target: '2026-11-18T16:00:00Z' },
    'indonesia-thailand': { name: 'Indonesia & Thailand', target: '2026-11-18T17:00:00Z' },
    'india': { name: 'India', target: '2026-11-18T18:30:00Z' },
    'uae': { name: 'United Arab Emirates', target: '2026-11-18T20:00:00Z' },
    'saudi-turkey': { name: 'Saudi Arabia & Turkey', target: '2026-11-18T21:00:00Z' },
    'eastern-europe': { name: 'Eastern Europe (Greece, Romania, Finland, etc.)', target: '2026-11-18T22:00:00Z' },
    'south-america': { name: 'Brazil, Argentina, Chile', target: '2026-11-19T03:00:00Z' },
    'mexico': { name: 'Mexico & Central America', target: '2026-11-19T06:00:00Z' }
  };

  const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  const activeSlug = regions[pathSlug] ? pathSlug : 'europe';
  const currentRegion = regions[activeSlug];

  const selectEl = document.getElementById('regionSelect');
  Object.keys(regions).forEach(slug => {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = regions[slug].name;
    if (slug === activeSlug) opt.selected = true;
    selectEl.appendChild(opt);
  });

  document.title = `GTA VI Countdown - ${currentRegion.name}`;
  document.getElementById('subText').textContent = `Releasing Nov 19, 2026 · ${currentRegion.name}`;

  const targetTime = new Date(currentRegion.target).getTime();
  function tick() {
    const now = Date.now();
    const diff = targetTime - now;
    if (diff <= 0) {
      document.getElementById('cd').innerHTML = '<p class="done">Available now</p>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
