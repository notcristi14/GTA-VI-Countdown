<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a0a2e url('bg.jpeg') center/cover no-repeat fixed;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(26,10,46,0.55) 0%, rgba(15,12,41,0.75) 50%, rgba(10,10,10,0.85) 100%);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    max-width: min(420px, 85vw);
    width: 100%;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.6));
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }
  .sub {
    font-size: 0.85rem;
    color: #e0b0ff;
    margin-bottom: 16px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .region-selector {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .region-selector label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #d8b4fe;
  }
  .region-selector select {
    background: rgba(20, 10, 40, 0.75);
    color: #fff;
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.85rem;
    backdrop-filter: blur(12px);
    cursor: pointer;
    outline: none;
  }
  .region-selector select option {
    background: #1a0a2e;
    color: #fff;
  }
  .platforms {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .platform-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    padding: 8px 18px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #fff;
  }
  .platform-icon {
    height: 18px;
    width: auto;
    filter: brightness(0) invert(1);
  }
  .countdown {
    display: flex;
    gap: clamp(12px, 4vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    min-width: 80px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 14px;
    padding: 18px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .num {
    font-size: clamp(2rem, 8vw, 3.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 18px rgba(255,105,180,0.6);
  }
  .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #d8b4fe;
    margin-top: 10px;
  }
  .done {
    font-size: 1.5rem;
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74,222,128,0.5);
  }
  @media (max-width: 480px) {
    .unit { min-width: 70px; padding: 14px 10px; }
    .platforms { gap: 10px; }
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo"><img src="logo.png" alt="Grand Theft Auto VI"></div>
    <p class="sub" id="subText">Releasing November 19, 2026</p>
    
    <div class="region-selector">
      <label for="regionSelect">Region:</label>
      <select id="regionSelect" onchange="location.href='/' + this.value"></select>
    </div>

    <!-- Platform Badges with Web SVG Logos -->
    <div class="platforms">
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg" alt="PlayStation Logo">
        <span>PlayStation 5</span>
      </div>
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" alt="Xbox Logo">
        <span>Xbox Series X|S</span>
      </div>
    </div>

    <div class="countdown" id="cd">
      <div class="unit"><div class="num" id="d">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="label">Mins</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="label">Secs</div></div>
    </div>
  </div>

<script>
  // All Timezone Data fetched from vicountdown.com
  const regions = {
    'europe': { name: 'Europe (CET / Central)', target: '2026-11-18T23:00:00Z' },
    'uk': { name: 'United Kingdom & Ireland', target: '2026-11-19T00:00:00Z' },
    'us-canada': { name: 'United States & Canada', target: '2026-11-19T05:00:00Z' },
    'new-zealand': { name: 'New Zealand', target: '2026-11-18T11:00:00Z' },
    'australia': { name: 'Australia', target: '2026-11-18T13:00:00Z' },
    'japan-korea': { name: 'Japan & South Korea', target: '2026-11-18T15:00:00Z' },
    'asia-pacific': { name: 'Hong Kong, Taiwan, SG, MY', target: '2026-11-18T16:00:00Z' },
    'indonesia-thailand': { name: 'Indonesia & Thailand', target: '2026-11-18T17:00:00Z' },
    'india': { name: 'India', target: '2026-11-18T18:30:00Z' },
    'uae': { name: 'United Arab Emirates', target: '2026-11-18T20:00:00Z' },
    'saudi-turkey': { name: 'Saudi Arabia & Turkey', target: '2026-11-18T21:00:00Z' },
    'eastern-europe': { name: 'Eastern Europe (Greece, Romania, Finland, etc.)', target: '2026-11-18T22:00:00Z' },
    'south-america': { name: 'Brazil, Argentina, Chile', target: '2026-11-19T03:00:00Z' },
    'mexico': { name: 'Mexico & Central America', target: '2026-11-19T06:00:00Z' }
  };

  // Determine current region slug from URL path
  const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  const activeSlug = regions[pathSlug] ? pathSlug : 'europe';
  const currentRegion = regions[activeSlug];

  // Populate Dropdown
  const selectEl = document.getElementById('regionSelect');
  Object.keys(regions).forEach(slug => {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = regions[slug].name;
    if (slug === activeSlug) opt.selected = true;
    selectEl.appendChild(opt);
  });

  // Update Page Title and Subtitle
  document.title = `GTA VI Countdown - ${currentRegion.name}`;
  document.getElementById('subText').textContent = `Releasing Nov 19, 2026 · ${currentRegion.name}`;

  // Countdown Logic
  const targetTime = new Date(currentRegion.target).getTime();
  function tick() {
    const now = Date.now();
    const diff = targetTime - now;
    if (diff <= 0) {
      document.getElementById('cd').innerHTML = '<p class="done">Available now</p>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
