<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>

<!-- Universal SVG Favicon & Device Fallbacks -->
<link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/logo.png">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg">

<!-- Microsoft Edge & Windows Start Menu Tiles -->
<meta name="msapplication-TileColor" content="#1a0a2e">
<meta name="msapplication-TileImage" content="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg">

<!-- Open Graph & Social Preview Tags -->
<meta property="og:title" content="GTA VI Countdown">
<meta property="og:type" content="website">
<meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg">
<meta property="og:image:type" content="image/svg+xml">
<meta property="twitter:card" content="summary">
<meta property="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg">

<!-- Web App Manifest -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GTA%20VI%20Countdown%22%2C%22short_name%22%3A%22GTA%20VI%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fa%2Fa5%2FGrand_Theft_Auto_VI_logo.svg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%231a0a2e%22%2C%22background_color%22%3A%22%231a0a2e%22%7D">

<!-- Mobile Web App & Theme Color Meta Tags -->
<meta name="theme-color" content="#1a0a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA VI Countdown">

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    min-height: 100%;
  }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #1a0a2e;
    background-image: url('/bgs/main.jpeg');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 20px 16px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
      180deg, 
      rgba(15, 8, 30, 0.55) 0%, 
      rgba(10, 10, 20, 0.70) 100%
    );
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 800px;
  }

  .logo {
    max-width: min(420px, 85vw);
    width: 100%;
    margin-bottom: 12px;
    background: transparent !important;
    filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.65));
  }

  .logo img {
    width: 100%;
    height: auto;
    display: block;
    background: transparent !important;
    object-fit: contain;
  }

  .sub {
    font-size: clamp(0.75rem, 2.5vw, 0.85rem);
    color: #e0b0ff;
    margin-bottom: 16px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    padding: 0 10px;
  }

  .region-selector {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }

  .region-selector label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #d8b4fe;
  }

  .region-selector select {
    background: rgba(20, 10, 40, 0.85);
    color: #fff;
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.85rem;
    backdrop-filter: blur(12px);
    cursor: pointer;
    outline: none;
    max-width: 100%;
  }

  .region-selector select option {
    background: #1a0a2e;
    color: #fff;
  }

  .platforms {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    width: 100%;
  }

  .platform-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    padding: 8px 16px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #fff;
  }

  .platform-icon {
    height: 16px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .countdown {
    display: flex;
    gap: clamp(8px, 2.5vw, 24px);
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .unit {
    flex: 1;
    min-width: 72px;
    max-width: 120px;
    background: rgba(20, 10, 40, 0.65);
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 14px;
    padding: 16px 10px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .num {
    font-size: clamp(1.8rem, 7vw, 3.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 18px rgba(255, 105, 180, 0.6);
  }

  .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #d8b4fe;
    margin-top: 8px;
  }

  .done {
    font-size: 1.5rem;
    color: #4ade80;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
  }

  .bg-switcher {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }

  .bg-btn {
    background: rgba(20, 10, 40, 0.75);
    border: 1px solid rgba(255, 140, 200, 0.35);
    color: #e0b0ff;
    border-radius: 16px;
    padding: 5px 10px;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .bg-btn:hover, .bg-btn.active {
    background: rgba(255, 105, 180, 0.3);
    color: #fff;
    border-color: rgba(255, 140, 200, 0.7);
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 32px;
    width: 100%;
  }

  .social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    background: rgba(20, 10, 40, 0.7);
    border: 1px solid rgba(255, 140, 200, 0.35);
    border-radius: 50%;
    backdrop-filter: blur(12px);
    transition: transform 0.2s, background 0.2s;
  }

  .social-link:hover {
    transform: scale(1.1);
    background: rgba(255, 105, 180, 0.25);
  }

  .social-link img {
    width: 20px;
    height: 20px;
    object-fit: contain;
  }

  @media (max-width: 480px) {
    body { padding: 16px 12px; }
    .sub { margin-bottom: 12px; }
    .region-selector { margin-bottom: 20px; }
    .platforms { gap: 8px; margin-bottom: 24px; }
    .platform-badge { padding: 6px 12px; font-size: 0.75rem; }
    .unit { min-width: 64px; padding: 12px 6px; }
    .label { font-size: 0.6rem; letter-spacing: 0.1em; }
    .socials { gap: 10px; margin-top: 24px; }
    .social-link { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Grand_Theft_Auto_VI_logo.svg" alt="Grand Theft Auto VI Logo" onerror="this.src='/logo.png'">
    </div>

    <p class="sub" id="subText">Releasing November 19, 2026</p>
    
    <div class="region-selector">
      <label for="regionSelect">Region:</label>
      <select id="regionSelect"></select>
    </div>

    <div class="platforms">
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/0/00/PlayStation_logo.svg" alt="PlayStation Logo">
        <span>PlayStation 5</span>
      </div>
      <div class="platform-badge">
        <img class="platform-icon" src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" alt="Xbox Logo">
        <span>Xbox Series X|S</span>
      </div>
    </div>

    <div class="countdown" id="cd">
      <div class="unit"><div class="num" id="d">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="label">Mins</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="label">Secs</div></div>
    </div>

    <div class="socials">
      <a class="social-link" href="https://www.rockstargames.com/" target="_blank" rel="noopener" title="Rockstar Games Website">
        <img src="https://cdn.simpleicons.org/rockstargames/ffffff" alt="Website">
      </a>
      <a class="social-link" href="https://x.com/RockstarGames" target="_blank" rel="noopener" title="Rockstar Games on X">
        <img src="https://cdn.simpleicons.org/x/ffffff" alt="X">
      </a>
      <a class="social-link" href="https://www.instagram.com/rockstargames/" target="_blank" rel="noopener" title="Rockstar Games on Instagram">
        <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram">
      </a>
      <a class="social-link" href="https://www.facebook.com/rockstargames" target="_blank" rel="noopener" title="Rockstar Games on Facebook">
        <img src="https://cdn.simpleicons.org/facebook/ffffff" alt="Facebook">
      </a>
      <a class="social-link" href="https://www.youtube.com/rockstargames" target="_blank" rel="noopener" title="Rockstar Games on YouTube">
        <img src="https://cdn.simpleicons.org/youtube/ffffff" alt="YouTube">
      </a>
      <a class="social-link" href="https://www.netflix.com/ro/title/83035795" target="_blank" rel="noopener" title="Netflix">
        <img src="https://cdn.simpleicons.org/netflix/ffffff" alt="Netflix">
      </a>
      <a class="social-link" href="https://discord.gg/rockstargames" target="_blank" rel="noopener" title="Rockstar Games on Discord">
        <img src="https://cdn.simpleicons.org/discord/ffffff" alt="Discord">
      </a>
      <a class="social-link" href="https://www.twitch.tv/rockstargames" target="_blank" rel="noopener" title="Rockstar Games on Twitch">
        <img src="https://cdn.simpleicons.org/twitch/ffffff" alt="Twitch">
      </a>
      <a class="social-link" href="https://x.com/RockstarSupport" target="_blank" rel="noopener" title="Rockstar Support on X">
        <img src="https://cdn.simpleicons.org/x/ffffff" alt="Support">
      </a>
      <a class="social-link" href="https://www.threads.com/@rockstargames" target="_blank" rel="noopener" title="Rockstar Games on Threads">
        <img src="https://cdn.simpleicons.org/threads/ffffff" alt="Threads">
      </a>
      <a class="social-link" href="https://www.tiktok.com/@rockstargames" target="_blank" rel="noopener" title="Rockstar Games on TikTok">
        <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok">
      </a>
    </div>

    <div class="bg-switcher">
      <button class="bg-btn" id="bgCycleBtn">Switch Background</button>
    </div>
  </div>

<script>
  const regions = {
    'new-zealand': { name: 'New Zealand', target: '2026-11-18T11:00:00Z' },
    'australia': { name: 'Australia', target: '2026-11-18T13:00:00Z' },
    'japan-korea': { name: 'Japan & South Korea', target: '2026-11-18T15:00:00Z' },
    'asia-pacific': { name: 'Hong Kong, Taiwan, Singapore, Malaysia', target: '2026-11-18T16:00:00Z' },
    'indonesia-thailand': { name: 'Indonesia & Thailand', target: '2026-11-18T17:00:00Z' },
    'india': { name: 'India', target: '2026-11-18T18:30:00Z' },
    'uae': { name: 'United Arab Emirates', target: '2026-11-18T20:00:00Z' },
    'saudi-turkey': { name: 'Saudi Arabia & Turkey', target: '2026-11-18T21:00:00Z' },
    'eastern-europe': { name: 'Eastern Europe / UTC+2 (Greece, Romania, Finland, Israel, South Africa, etc.)', target: '2026-11-18T22:00:00Z' },
    'europe': { name: 'Central Europe (CET)', target: '2026-11-18T23:00:00Z' },
    'uk': { name: 'United Kingdom, Ireland, Iceland, Portugal', target: '2026-11-19T00:00:00Z' },
    'south-america': { name: 'Brazil, Argentina, Chile, Paraguay, Uruguay', target: '2026-11-19T03:00:00Z' },
    'bolivia': { name: 'Bolivia', target: '2026-11-19T04:00:00Z' },
    'us-canada': { name: 'United States, Canada + Colombia, Ecuador, Panama, Peru', target: '2026-11-19T05:00:00Z' },
    'mexico': { name: 'Mexico & Central America', target: '2026-11-19T06:00:00Z' }
  };

  const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
  const savedRegion = localStorage.getItem('gtaRegion');
  let activeSlug = 'europe';
  if (pathSlug && regions[pathSlug]) {
    activeSlug = pathSlug;
    localStorage.setItem('gtaRegion', pathSlug);
  } else if (savedRegion && regions[savedRegion]) {
    activeSlug = savedRegion;
    if (pathSlug !== activeSlug) {
      history.replaceState(null, '', '/' + activeSlug);
    }
  }
  const currentRegion = regions[activeSlug];

  const selectEl = document.getElementById('regionSelect');
  Object.keys(regions).forEach(slug => {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = regions[slug].name;
    if (slug === activeSlug) opt.selected = true;
    selectEl.appendChild(opt);
  });

  selectEl.addEventListener('change', () => {
    const val = selectEl.value;
    localStorage.setItem('gtaRegion', val);
    location.href = '/' + val;
  });

  document.title = `GTA VI Countdown - ${currentRegion.name}`;
  document.getElementById('subText').textContent = `Releasing Nov 19, 2026 · ${currentRegion.name}`;

  const targetTime = new Date(currentRegion.target).getTime();
  function tick() {
    const now = Date.now();
    const diff = targetTime - now;
    if (diff <= 0) {
      document.getElementById('cd').innerHTML = '<p class="done">Available now</p>';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = String(h).padStart(2,'0');
    document.getElementById('m').textContent = String(m).padStart(2,'0');
    document.getElementById('s').textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);

  const backgrounds = ['main.jpeg', 'Ambrosia_Postcard_landscape.jpg', 'Boobie_Ike_landscape.jpg', 'Brian_Heder_landscape.jpg', 'Cal_Hampton_landscape.jpg', 'DreQuan_Priest_landscape.jpg', 'Grassrivers_Postcard_landscape.jpg', 'Jason_and_Lucia_01_With_Logos_landscape.jpg', 'Jason_and_Lucia_01_landscape.jpg', 'Jason_and_Lucia_02_With_Logos_landscape.jpg', 'Jason_and_Lucia_02_landscape.jpg', 'Jason_and_Lucia_Beach_With_Logos_landscape.jpg', 'Jason_and_Lucia_Beach_landscape.jpg', 'Jason_and_Lucia_Motel_landscape.jpg', 'Jason_and_Lucia_Robbery_With_Logo_landscape.jpg', 'Jason_and_Lucia_Robbery_landscape.jpg', 'Leonida_Keys_Postcard_landscape.jpg', 'Mount_Kalaga_National_Park_Postcard_landscape.jpg', 'Official_Cover_Art_landscape.jpg', 'Port_Gellhorn_Postcard_landscape.jpg', 'Raul_Bautista_landscape.jpg', 'Real_Dimez_landscape.jpg', 'The_Album_Cover_Art_landscape.jpg', 'Vice_City_Postcard_landscape.jpg'];
  let bgIndex = 0;
  const bgBtn = document.getElementById('bgCycleBtn');
  function setBg(i) {
    bgIndex = ((i % backgrounds.length) + backgrounds.length) % backgrounds.length;
    const bg = '/bgs/' + backgrounds[bgIndex];
    document.body.style.backgroundImage = "url('" + bg + "')";
    localStorage.setItem('gtaBgIndex', bgIndex);
  }
  if (bgBtn) bgBtn.addEventListener('click', () => setBg(bgIndex + 1));
  const savedIdx = localStorage.getItem('gtaBgIndex');
  if (savedIdx !== null) setBg(parseInt(savedIdx, 10));
</script>
</body>
</html>
