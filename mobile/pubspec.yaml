name: vi_countdown
description: VI Countdown — Flutter wrapper for the live GTA VI countdown (Eastern Europe).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # Optional: copy repo-root logo.png → assets/logo.png then run:
  #   dart run flutter_launcher_icons
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1A0A2E"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
